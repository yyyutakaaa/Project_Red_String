# Builds the desktop installers for every commit on main and publishes them as a GitHub release.
#
# Installed apps do not need these to stay current: they pull new game files from the live site
# (see desktop/updater.cjs). The installers are for first installs and for changes to the shell.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: mac
            files: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: windows
            files: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Set version
        run: npm version "${{ env.APP_VERSION }}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - name: Build installer
        run: npm run ${{ matrix.script }} -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Which shell these installers are: the app checks it before it installs one from the game.
      - name: Write shell.json
        run: |
          fp="$(node desktop/fingerprint.cjs)"
          test -n "$fp"
          printf '{"fingerprint":"%s","version":"%s"}\n' "$fp" "$APP_VERSION" > installers/shell.json
          cat installers/shell.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          gh release create "v${APP_VERSION}" installers/* \
            --target "$GITHUB_SHA" \
            --title "Red String ${APP_VERSION}" \
            --notes "Desktop installers for macOS and Windows, built from commit ${short}. The builds are not code-signed. Installed apps update the game by themselves; new versions of the app install from the game too. You only need an installer for a first install."
